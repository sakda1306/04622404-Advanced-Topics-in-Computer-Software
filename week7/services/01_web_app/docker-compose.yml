name: pitchside01
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_DEMO_MODE: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: pitchside-01-api-dev
    build:
      context: ../02_api_backend
      dockerfile: ../01_web_app/docker/api.Dockerfile
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && python -m app.seed && exec uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/football
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-demo-only-secret-change-before-production-01}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin1234}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-demo1234}
      AI_ROUTER_SERVICE_URL: http://router:8003
      FOOTBALL_DATA_URL: http://football-data:8007
      RETRIEVAL_URL: http://football-data:8007
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      router:
        condition: service_started
      football-data:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  router:
    image: pitchside-01-api-dev
    pull_policy: never
    command:
      [
        "uvicorn",
        "stubs.router_stub:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8003",
      ]

  football-data:
    image: pitchside-01-api-dev
    pull_policy: never
    command:
      [
        "uvicorn",
        "stubs.football_data_stub:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8007",
      ]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: football
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d football"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pgdata:
