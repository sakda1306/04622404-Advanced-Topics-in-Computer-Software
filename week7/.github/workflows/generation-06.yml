name: generation-06

on:
  push:
    branches: [ develop, main ]
    paths:
      - 'services/06_llm_generation/**'
      - '.github/workflows/generation-06.yml'
  pull_request:
    paths:
      - 'services/06_llm_generation/**'
      - '.github/workflows/generation-06.yml'

defaults:
  run:
    working-directory: services/06_llm_generation

jobs:
  lint-test-and-boot:
    runs-on: ubuntu-latest
    env:
      LLM_MOCK: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff

      - name: Lint with ruff
        run: ruff check app tests

      - name: Check formatting with ruff
        run: ruff format --check app tests

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Boot the service and check /health
        run: |
          nohup python -m uvicorn app.main:app --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "service is up"
              break
            fi
            echo "waiting for service... ($i)"
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health || (cat uvicorn.log && exit 1)

      - name: Upload uvicorn log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uvicorn-log
          path: services/06_llm_generation/uvicorn.log
