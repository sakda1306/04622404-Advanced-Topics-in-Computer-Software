name: 04-engines
on:
  pull_request:
    branches: [develop, main]
    paths: ["services/04_ai_engines/**"]
  push:
    branches: [develop, main]
    paths: ["services/04_ai_engines/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engines-04-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/04_ai_engines
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/04_ai_engines/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q tests
