# Backend development stack (docs/04_project_structure.md section 5.2).
name: tsa-backend

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tsa}:${POSTGRES_PASSWORD:-tsa}@postgres:5432/${POSTGRES_DB:-tsa}
  REDIS_URL: redis://redis-core:6379/0
  REDIS_CACHE_URL: redis://redis-cache:6379/0
  CELERY_BROKER_URL: redis://redis-core:6379/2
  JWT_ISSUER: ${JWT_ISSUER:-http://localhost:8000/dev-issuer}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-travel-safety-api}
  AGENT_SERVICE_URL: ${AGENT_SERVICE_URL:-http://mock-agent:8010}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  # Set to http://jaeger:4318 and add `--profile observability` to see traces (D-89).
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  # Dev-only HS256 key so `python -m scripts.dev_token` can issue tokens (never set in prod).
  DEV_JWT_SIGNING_KEY: ${DEV_JWT_SIGNING_KEY:-dev-only-signing-key-change-me-0123456789}
  PSEUDONYM_SECRET: ${PSEUDONYM_SECRET:-}
  IP_HASH_SECRET: ${IP_HASH_SECRET:-}
  # Empty = the built-in dev key (refused in prod); see .env.example (D-81).
  COLUMN_ENCRYPTION_KEYS: ${COLUMN_ENCRYPTION_KEYS:-}
  OBJECT_STORAGE_ENDPOINT: minio:9000
  OBJECT_STORAGE_PUBLIC_URL: ${OBJECT_STORAGE_PUBLIC_URL:-http://localhost:9000}
  OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-tsa-dev}
  OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-tsa-dev-secret}
  AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:-dev-agent-token}

services:
  api:
    build:
      context: .
      target: dev
    image: tsa-backend:dev
    environment:
      <<: *api-env
      WATCHFILES_FORCE_POLLING: "true"  # file events do not cross Windows bind mounts
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      mock-agent:
        condition: service_healthy
      redis-core:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [backend]

  # Celery worker: the only caller of the Agent (D-03).
  worker:
    image: tsa-backend:dev
    build:
      context: .
      target: dev
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker",
              "-Q", "recommendations,alerts,maintenance", "--concurrency", "2",
              "--loglevel", "INFO"]
    environment:
      <<: *api-env
      OTEL_SERVICE_NAME: travel-safety-worker
      # The pool processes add up their metrics here; the main process serves them (D-91).
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      WORKER_METRICS_PORT: "9101"
    # 9101 is not published: Prometheus scrapes it on the backend network only.
    volumes:
      - ./app:/app/app:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      mock-agent:
        condition: service_healthy
      redis-core:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping --timeout 5 -d celery@$$HOSTNAME"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [backend]

  # Celery beat: queues the live-alert scan every TRIP_ALERT_SCAN_MINUTES (D-65).
  # Run exactly one beat per stack, or scans are queued twice.
  beat:
    image: tsa-backend:dev
    build:
      context: .
      target: dev
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat",
              "--schedule", "/tmp/celerybeat-schedule", "--loglevel", "INFO"]
    environment:
      <<: *api-env
    volumes:
      - ./app:/app/app:ro
    depends_on:
      redis-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/celerybeat-schedule"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [backend]

  migrate:
    image: tsa-backend:dev
    build:
      context: .
      target: dev
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed_reference_data"]
    environment:
      <<: *api-env
    volumes:
      - ./app:/app/app:ro
      - ./migrations:/app/migrations:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  # Stand-in for Module 03 until the real Travel AI Agent is available (D-24).
  # Switch scenario: curl -X PUT localhost:8010/_mock/scenario -d '{"name":"high_risk"}'
  mock-agent:
    image: tsa-backend:dev
    build:
      context: .
      target: dev
    command: ["uvicorn", "mock_agent.main:app", "--host", "0.0.0.0", "--port", "8010",
              "--no-access-log", "--reload", "--reload-dir", "mock_agent"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      MOCK_SCENARIO: ${MOCK_SCENARIO:-low_risk}
      MOCK_REQUIRE_TOKEN: ${AGENT_SERVICE_TOKEN:-dev-agent-token}
      MOCK_STEP_DELAY_SECONDS: ${MOCK_STEP_DELAY_SECONDS:-0.5}
    ports:
      - "${MOCK_AGENT_HOST_PORT:-8010}:8010"
    volumes:
      - ./mock_agent:/app/mock_agent:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [backend]

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tsa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tsa}
      POSTGRES_DB: ${POSTGRES_DB:-tsa}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  redis-core:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
              "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_CORE_HOST_PORT:-6379}:6379"
    volumes:
      - redis-core-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  redis-cache:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_CACHE_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  # S3-compatible storage for data exports (D-84); console on MINIO_CONSOLE_HOST_PORT.
  minio:
    # Docker Hub no longer serves minio/minio; the project publishes on quay.io.
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tsa-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tsa-dev-secret}
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  # Trace viewer, only with `--profile observability` (UI on JAEGER_UI_HOST_PORT).
  # It receives OTLP directly, so dev needs no separate collector (D-89).
  jaeger:
    image: jaegertracing/jaeger:${JAEGER_VERSION:-2.10.0}
    profiles: [observability]
    ports:
      - "${JAEGER_UI_HOST_PORT:-16686}:16686"
    networks: [backend]

volumes:
  pgdata:
  redis-core-data:
  minio-data:

networks:
  backend:
