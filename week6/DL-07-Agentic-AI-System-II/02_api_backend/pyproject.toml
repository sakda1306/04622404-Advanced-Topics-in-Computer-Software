[project]
name = "travel-safety-api"
version = "0.1.0"
description = "API and backend for the Real-Time Travel Safety & Advisory Assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "uuid6>=2024.7.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "geoalchemy2>=0.16",
    "httpx>=0.27",
    "redis>=5.2",
    "joserfc>=1.0",
    "tzdata>=2024.1",
    "celery[redis]>=5.4",
    "cryptography>=44",
    "minio>=7.2",
    "prometheus-client>=0.21",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-instrumentation-celery>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.8",
    "fakeredis[lua]>=2.26",
    "respx>=0.21",
    "celery-types>=0.26.0",
    "schemathesis>=3.39",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs PostgreSQL/Redis containers",
    "e2e: runs against the docker compose stack (set E2E_BASE_URL)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies in parameter defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "app.api.auth.require_scopes",
    "app.api.v1.admin.access.admin_actor",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["app.domain.*", "app.services.*", "app.core.*"]
strict = true

[[tool.mypy.overrides]]
module = ["uuid6"]
ignore_missing_imports = true
