<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recommendation Request → SSE Progress</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · 02_api_backend</p>
    <h1>Recommendation request — accepted, then followed over SSE to completion</h1>

    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sse-recommendation-flow-title sse-recommendation-flow-desc">
      <title id="sse-recommendation-flow-title">Recommendation request followed over SSE to completion</title>
      <desc id="sse-recommendation-flow-desc">Sequence diagram of the Web App asking for a travel recommendation, the API accepting it with 202 and a job id, the Web App exchanging that id for a short-lived stream ticket, then opening an SSE connection that pushes progress events until a completed event ends the stream.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================= LIFELINES ================= -->
      <line x1="200" y1="104" x2="200" y2="660" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="740" y1="104" x2="740" y2="660" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ================= ACTIVATION BAR =================
           API holds the SSE response open from the GET (M5) through completed (M9). -->
      <rect x="736" y="380" width="8" height="248" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- ================= MESSAGE ARROWS ================= -->
      <!-- M1: Web App -> API (call, link-blue) -->
      <line x1="200" y1="160" x2="740" y2="160" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M2: API -> Web App (return, muted dashed) -->
      <line x1="740" y1="216" x2="200" y2="216" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M3: Web App -> API (call, link-blue) -->
      <line x1="200" y1="272" x2="740" y2="272" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M4: API -> Web App (return, muted dashed) -->
      <line x1="740" y1="328" x2="200" y2="328" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M5: Web App -> API (call, link-blue) — opens the SSE connection -->
      <line x1="200" y1="384" x2="740" y2="384" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M6: API -> Web App (async push, muted dashed, open head) -->
      <line x1="740" y1="440" x2="200" y2="440" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <!-- M7: API -> Web App (async push) -->
      <line x1="740" y1="496" x2="200" y2="496" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <!-- M8: API -> Web App (async push) -->
      <line x1="740" y1="552" x2="200" y2="552" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <!-- M9: API -> Web App (headline success, coral) -->
      <line x1="740" y1="608" x2="200" y2="608" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- ================= MESSAGE LABELS ================= -->
      <!-- M1 -->
      <rect x="366" y="140" width="208" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="149" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /V1/TRAVEL/RECOMMENDATIONS</text>

      <!-- M2 -->
      <rect x="418" y="196" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="205" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">202 · JOB_ID</text>

      <!-- M3 -->
      <rect x="358" y="252" width="224" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="261" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /V1/JOBS/{ID}/STREAM-TICKET</text>

      <!-- M4 -->
      <rect x="422" y="308" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="317" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">200 · TICKET</text>

      <!-- M5 -->
      <rect x="352" y="364" width="236" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="373" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /V1/JOBS/{ID}/EVENTS?TICKET=…</text>

      <!-- M6 -->
      <rect x="358" y="420" width="224" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="429" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVENT: PROGRESS · FETCHING_DATA</text>

      <!-- M7 -->
      <rect x="356" y="476" width="228" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="485" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVENT: PROGRESS · ASSESSING_RISK</text>

      <!-- M8 -->
      <rect x="336" y="532" width="268" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="541" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVENT: PROGRESS · GENERATING_ADVICE</text>

      <!-- M9 (headline) -->
      <rect x="360" y="588" width="220" height="12" rx="2" fill="#f5f5f5"/>
      <text x="470" y="597" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVENT: COMPLETED · RESULT_URL</text>

      <!-- ================= ANNOTATION CALLOUTS ================= -->
      <!-- Callout 1: why a ticket, not a header -->
      <text x="1160" y="296" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">EventSource</text>
      <text x="1160" y="314" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">can't send headers</text>
      <path d="M 1040 300 Q 900 300 764 300" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="764" cy="300" r="2" fill="#2d3142"/>

      <!-- Callout 2: EventSource auto-reconnects unless closed -->
      <text x="1160" y="664" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">client must</text>
      <text x="1160" y="682" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">call .close()</text>
      <path d="M 1040 668 Q 880 640 764 624" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="764" cy="624" r="2" fill="#2d3142"/>

      <!-- ================= ACTOR BOXES ================= -->
      <!-- Web App (client / soft) -->
      <rect x="110" y="40" width="180" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="110" y="40" width="180" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="118" y="46" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="134" y="55" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="200" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Web App</text>
      <text x="200" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">module 01</text>

      <!-- Backend API (focal / coral) -->
      <rect x="650" y="40" width="180" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="650" y="40" width="180" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="658" y="46" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.45)" stroke-width="0.8"/>
      <text x="672" y="55" fill="rgba(235,108,54,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="740" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Backend API</text>
      <text x="740" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FastAPI · /v1</text>

      <!-- ================= LEGEND ================= -->
      <line x1="40" y1="724" x2="1160" y2="724" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="740" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="760" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="768" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal (API)</text>

      <rect x="225" y="756" width="4" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <text x="237" y="768" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Holding connection</text>

      <line x1="410" y1="763" x2="438" y2="763" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="446" y="768" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP request</text>

      <line x1="595" y1="763" x2="623" y2="763" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="631" y="768" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>

      <line x1="780" y1="763" x2="808" y2="763" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="816" y="768" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">SSE event (async)</text>

      <line x1="965" y1="763" x2="993" y2="763" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="1001" y="768" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Completed (headline)</text>
    </svg>
  </div>
</body>
</html>
