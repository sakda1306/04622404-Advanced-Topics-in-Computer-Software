# Runs Module 03 together with Module 07. The 03 image also packages the callable
# Module 04 transport/disaster, Module 05 integration, and Module 06 adapters.
services:
  travel-agent:
    build:
      context: ..
      dockerfile: 03_travel_ai_agent/Dockerfile
      target: runtime
    ports:
      - "127.0.0.1:${AGENT_HOST_PORT:-8010}:8010"
    environment:
      AGENT_SERVICE_TOKEN: "${AGENT_SERVICE_TOKEN:-}"
      DECISION_SERVICE_URL: http://decision-engine:8050
      USE_MOCK_TOOLS: "${USE_MOCK_TOOLS:-false}"
      TOMTOM_API_KEY: "${TOMTOM_API_KEY:-}"
      OSRM_BASE_URL: "${OSRM_BASE_URL:-https://router.project-osrm.org}"
      MAX_AGENT_STEPS: "${MAX_AGENT_STEPS:-12}"
      MAX_TOOL_CALLS: "${MAX_TOOL_CALLS:-20}"
      AGENT_TOTAL_TIMEOUT: "${AGENT_TOTAL_TIMEOUT:-60}"
      TOOL_TIMEOUT_SECONDS: "${TOOL_TIMEOUT_SECONDS:-5}"
    depends_on:
      decision-engine:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  decision-engine:
    build:
      context: ../07_decision_llm_engine
      target: runtime
    volumes:
      - decision-audit:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  decision-audit:
