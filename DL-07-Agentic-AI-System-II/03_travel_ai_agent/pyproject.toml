[project]
name = "teamd-travel-agent"
version = "0.1.0"
description = "Module 03: plans a run, calls tools, and hands the evidence to Module 07"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "tenacity>=9,<10",
]

[dependency-groups]
# Module 07 is installed for tests only: the contract tests run the real decision
# engine in-process, so a change on either side breaks our tests instead of production.
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
  "teamd-decision-engine",
]

[tool.uv.sources]
teamd-decision-engine = { path = "../07_decision_llm_engine", editable = true }

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["travel_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
