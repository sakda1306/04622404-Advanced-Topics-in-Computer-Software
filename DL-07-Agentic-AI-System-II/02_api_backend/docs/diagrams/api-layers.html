<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Backend Layers</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · 02_api_backend</p>
    <h1>Inside the API — a request passes down five layers</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="api-layers-title api-layers-desc">
      <title id="api-layers-title">API Backend Layers</title>
      <desc id="api-layers-desc">Layer stack of the FastAPI backend: a request passes middleware, the HTTP layer, application services and the pure domain layer with the Safety Gate, down to infrastructure adapters for PostgreSQL, Redis, the Agent client and object storage; the Celery worker enters at the services layer.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ DIRECTION INDICATORS (outside the stack) ============ -->
      <text x="144" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HTTP REQUEST</text>
      <line x1="144" y1="104" x2="144" y2="526" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <text x="1200" y="286" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CELERY TASK</text>
      <path d="M1200,296 V312 Q1200,320 1192,320 H1122" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- ============ STACK ============ -->
      <!-- L1 Middleware -->
      <rect x="192" y="96" width="928" height="88" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="216" y="144" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L1</text>
      <text x="264" y="136" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Middleware</text>
      <text x="264" y="156" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">request &amp; correlation id · body size and type · per-IP rate limit · security headers</text>
      <text x="1096" y="144" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">app/api/middleware</text>

      <!-- L2 HTTP API -->
      <rect x="192" y="184" width="928" height="88" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="216" y="232" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L2</text>
      <text x="264" y="224" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">HTTP API</text>
      <text x="264" y="244" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">JWT + scopes · Idempotency-Key · Pydantic contracts · SSE · RFC 9457 errors</text>
      <text x="1096" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">app/api · app/schemas</text>

      <!-- L3 Services -->
      <rect x="192" y="272" width="928" height="88" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="216" y="320" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L3</text>
      <text x="264" y="312" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Services</text>
      <text x="264" y="332" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">use cases · sync/async decision · job state · audit · ports (Protocols)</text>
      <text x="1096" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">app/services</text>

      <!-- L4 Domain (focal) -->
      <rect x="192" y="360" width="928" height="88" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="216" y="408" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L4</text>
      <text x="264" y="400" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Domain + Safety Gate</text>
      <text x="264" y="420" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">rules R-01..R-07 · freshness · normalization · sanitizer — pure Python, no I/O</text>
      <text x="1096" y="408" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">app/domain</text>

      <!-- L5 Infrastructure -->
      <rect x="192" y="448" width="928" height="88" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="216" y="496" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L5</text>
      <text x="264" y="488" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', sans-serif">Infrastructure</text>
      <text x="264" y="508" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">SQLAlchemy + PostGIS · Redis stores · AgentClient (retry, circuit breaker) · MinIO</text>
      <text x="1096" y="496" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">app/infrastructure</text>

      <!-- Outer silhouette -->
      <rect x="192" y="96" width="928" height="440" fill="none" stroke="#4f5d75" stroke-width="1"/>

      <!-- Editorial aside -->
      <text x="192" y="584" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">The worker enters at Services: only it calls the Agent, and every answer passes the Safety Gate before it is stored or shown.</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="648" x2="1240" y2="648" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="668" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="40" y="680" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="688" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal layer: safety rules</text>

      <rect x="208" y="680" width="14" height="10" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="228" y="688" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Layer (calls only the layers below)</text>

      <line x1="420" y1="685" x2="448" y2="685" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="456" y="688" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP entry</text>

      <line x1="548" y1="685" x2="576" y2="685" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="584" y="688" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Worker entry</text>
    </svg>
  </div>
</body>
</html>
