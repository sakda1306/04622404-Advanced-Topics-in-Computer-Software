services:
  decision-engine:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${DECISION_HOST_PORT:-8050}:8050"
    environment:
      DECISION_POLICY_VERSION: "${DECISION_POLICY_VERSION:-prototype-v3}"
      POLICY_APPROVED: "${POLICY_APPROVED:-false}"
      PROMPT_VERSION: "${PROMPT_VERSION:-v1}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL_EXPLAINER: "${LLM_MODEL_EXPLAINER:-disabled}"
      TEMPERATURE: "${TEMPERATURE:-0}"
      MAX_INPUT_TOKENS: "${MAX_INPUT_TOKENS:-8000}"
      MAX_OUTPUT_TOKENS: "${MAX_OUTPUT_TOKENS:-1500}"
      LLM_TIMEOUT: "${LLM_TIMEOUT:-3}"
      LLM_MAX_ATTEMPTS: "${LLM_MAX_ATTEMPTS:-2}"
      SUPPORTED_LOCALES: "${SUPPORTED_LOCALES:-th-TH,en-US}"
      ESCALATION_RULES: "${ESCALATION_RULES:-missing,stale,conflicting,incomplete,low_confidence,unverified_warning,partial,freshness_unknown}"
      AUDIT_LOG_PATH: /app/data/audit.jsonl
      # Mount any custom catalog read-only and use its container path here.
      EMERGENCY_CATALOG_PATH: "${DECISION_EMERGENCY_CATALOG_PATH:-/app/decision_engine/templates/emergency-v1.json}"
    volumes:
      - decision-audit:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8050/health', timeout=2)"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  decision-audit:
